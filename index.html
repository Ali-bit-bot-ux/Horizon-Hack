    <script>
        // --- 1. ВСТАВЬ СЮДА СВОИ КЛЮЧИ! ---
        const supabaseUrl = 'https://zsjskdxkpdijzyvtpjyd.supabase.co'; 
        const supabaseKey = 'sb_publishable_EzIBIvr_2e02KEHwJtw1Nw_3P9V1voG'; 
        const AI_API_KEY = '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'; 

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        const AI_API_URL = 'https://api.groq.com/openai/v1/chat/completions';
        const AI_MODEL = 'llama-3.1-8b-instant';

        let currentUser = null;
        let xp = parseInt(localStorage.getItem('fx82_xp')) || 0;
        let level = parseInt(localStorage.getItem('fx82_level')) || 1;

        // --- 2. ЛОГИКА ТАМАГОЧИ (XP И УРОВЕНЬ) ---
        function updateXPUI() {
            const levelEl = document.getElementById('capi-level');
            const barEl = document.getElementById('capi-xp-bar');
            const percentEl = document.getElementById('xp-percent');

            if (levelEl) levelEl.innerText = level;
            if (barEl) barEl.style.width = xp + '%';
            if (percentEl) percentEl.innerText = xp + '%';
        }

        function addXP(amount) {
            xp += amount;
            if (xp >= 100) {
                level++;
                xp -= 100;
                // Более красивый алерт можно сделать библиотекой, пока так
                alert(`🎉 НОВЫЙ УРОВЕНЬ! Капибара достигла ${level} уровня!`);
            }
            localStorage.setItem('fx82_xp', xp);
            localStorage.setItem('fx82_level', level);
            updateXPUI();
        }

        function completeTask() {
            addXP(30);
            document.getElementById('task-card').classList.add('hidden');
            updateCapybara(0, 100); // Делаем ее счастливой
        }

        // --- 3. НАВИГАЦИЯ ---
        function switchScreen(id) {
            const screens = ['auth-container', 'main-container', 'stats-container'];
            screens.forEach(s => document.getElementById(s).classList.add('hidden'));
            const target = document.getElementById(id);
            if (target) {
                target.classList.remove('hidden');
                // При переходе на главный экран скроллим наверх
                if (id === 'main-container') window.scrollTo(0,0); 
                if (id === 'main-container' || id === 'stats-container') loadWeeklyData();
            }
        }

        function toggleInputMode(mode) {
            const micBlock = document.getElementById('mic-block');
            const textBlock = document.getElementById('text-block');
            if(mode === 'text') {
                micBlock.classList.add('hidden');
                textBlock.classList.remove('hidden');
                textBlock.classList.add('flex'); // Важно для флекс контейнера
            } else {
                textBlock.classList.add('hidden');
                textBlock.classList.remove('flex');
                micBlock.classList.remove('hidden');
            }
        }

        // --- 4. АВТОРИЗАЦИЯ ---
        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-btn');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<span class="animate-pulse">Синхронизация...</span>';

            try {
                let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    // Пробуем регистрацию
                     const { data: upData, error: upError } = await supabaseClient.auth.signUp({ email, password });
                    if (upError) throw upError;
                    data = upData;
                }
                if (data && data.user) {
                    currentUser = data.user;
                    localStorage.setItem('fx82_session', JSON.stringify(data.user));
                    switchScreen('main-container');
                    updateXPUI();
                }
            } catch (e) { alert("Ошибка входа: " + e.message); }
            finally { btn.disabled = false; btn.innerHTML = originalBtnText; }
        }

        // --- 5. ИИ АНАЛИЗ ---
        async function analyzeTextAndSave() {
            const textInput = document.getElementById('mood-text');
            const text = textInput.value;
            if (!text.trim() || !currentUser) return;
            const btn = document.getElementById('send-btn');
            const originalBtnText = btn.innerHTML;

const audioTracks = {
    rain: new Audio('rain.mp3'),
    piano: new Audio('piano.mp3'),
    beat: new Audio('beat.mp3'),
    bass: new Audio('bass.mp3')
};

let isAudioPlaying = false;

// Настраиваем все треки на бесконечный цикл
Object.values(audioTracks).forEach(track => {
    track.loop = true;
    track.volume = 0; // Изначально всё на нуле (тишина)
});

// Включение/выключение музыки кнопкой
function toggleAudio() {
    const iconOff = document.getElementById('audio-icon-off');
    const iconOn = document.getElementById('audio-icon-on');
    
    if (!isAudioPlaying) {
        // Включаем
        Object.values(audioTracks).forEach(track => {
            track.play().catch(e => console.log("Браузер блочит автоплей", e));
        });
        isAudioPlaying = true;
        iconOff.classList.add('hidden');
        iconOn.classList.remove('hidden');
        
        // Запускаем базовый чилловый микс
        updateSoundtrack(30, 50); 
    } else {
        // Выключаем (ставим громкость на 0, чтобы не прерывать синхронизацию)
        Object.values(audioTracks).forEach(track => track.volume = 0);
        isAudioPlaying = false;
        iconOff.classList.remove('hidden');
        iconOn.classList.add('hidden');
    }
}

// Умный микшер: меняет громкость дорожек на основе данных от ИИ
function updateSoundtrack(stress, energy) {
    if (!isAudioPlaying) return; // Если юзер выключил звук, ничего не делаем

    console.log(`🎵 Микширую звук: Стресс ${stress}, Энергия ${energy}`);

    // Плавное изменение громкости (чтобы не пугать юзера резкими скачками)
    const fadeTo = (track, targetVolume) => {
        // Простая имитация плавности через setTimeout
        let current = track.volume;
        const step = targetVolume > current ? 0.05 : -0.05;
        const interval = setInterval(() => {
            current += step;
            if ((step > 0 && current >= targetVolume) || (step < 0 && current <= targetVolume)) {
                track.volume = Math.max(0, Math.min(1, targetVolume)); // Защита от выхода за пределы 0-1
                clearInterval(interval);
            } else {
                track.volume = Math.max(0, Math.min(1, current));
            }
        }, 100);
    };

    if (stress > 60) {
        // ПАНИКА/СТРЕСС: Шум дождя громко, остальное глушим (фокус на дыхании)
        fadeTo(audioTracks.rain, 0.8);
        fadeTo(audioTracks.piano, 0.1);
        fadeTo(audioTracks.beat, 0.0);
        fadeTo(audioTracks.bass, 0.3);
    } else if (energy < 35) {
        // УСТАЛОСТЬ/ГРУСТЬ: Мягкое пианино, легкий дождь
        fadeTo(audioTracks.rain, 0.2);
        fadeTo(audioTracks.piano, 0.7);
        fadeTo(audioTracks.beat, 0.0);
        fadeTo(audioTracks.bass, 0.4);
    } else if (stress < 30 && energy > 60) {
        // БОДРОСТЬ/ЧИЛЛ: Lo-Fi бит, басс
        fadeTo(audioTracks.rain, 0.0);
        fadeTo(audioTracks.piano, 0.3);
        fadeTo(audioTracks.beat, 0.6);
        fadeTo(audioTracks.bass, 0.5);
    } else {
        // НЕЙТРАЛЬНО: Ровный баланс
        fadeTo(audioTracks.rain, 0.1);
        fadeTo(audioTracks.piano, 0.4);
        fadeTo(audioTracks.beat, 0.3);
        fadeTo(audioTracks.bass, 0.3);
    }
}
// --- 9. ТАКТИЛЬНОЕ ДЫХАНИЕ (HAPTIC API) ---
let breathInterval;
let breathTimeout;

function startTactileBreathing() {
    const btn = document.getElementById('task-action-btn');
    const text = document.getElementById('task-text');
    const avatar = document.getElementById('capi-container');
    
    // Меняем кнопку, чтобы пользователь мог прервать дыхание
    btn.innerHTML = "Остановить 🛑";
    btn.onclick = stopTactileBreathing;
    
    // Настраиваем сверхплавную анимацию для аватара
    avatar.style.transition = "transform 4s linear";
    
    let step = 0;
    
    function breathingCycle() {
        if (step === 0) {
            // ВДОХ (4 сек)
            text.innerHTML = "<span class='text-primary text-xl font-black'>Вдыхай... 🌬️</span>";
            avatar.style.transform = "scale(1.3)"; // Капибара "надувается"
            
            // Непрерывная мягкая вибрация на 4 секунды
            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500, 200, 500])
            
        } else if (step === 1) {
            // ЗАДЕРЖКА (4 сек)
            text.innerHTML = "<span class='text-orange-500 text-xl font-black'>Держи... ⏳</span>";
            if (navigator.vibrate) navigator.vibrate(0); // Тишина
            
        } else if (step === 2) {
            // ВЫДОХ (4 сек)
            text.innerHTML = "<span class='text-blue-500 text-xl font-black'>Выдыхай... 💨</span>";
            avatar.style.transform = "scale(1)"; // Капибара "сдувается"
            
            // Пульсирующая вибрация (имитация медленного выдоха)
            if (navigator.vibrate) navigator.vibrate([200, 300, 200, 300, 200, 300, 200, 300]);
            
        } else if (step === 3) {
            // ЗАДЕРЖКА (4 сек)
            text.innerHTML = "<span class='text-textMuted text-xl font-black'>Держи... ⏳</span>";
            if (navigator.vibrate) navigator.vibrate(0); // Тишина
        }
        
        step = (step + 1) % 4;
    }

    // Запускаем первый шаг немедленно
    breathingCycle();
    // И зацикливаем каждые 4 секунды
    breathInterval = setInterval(breathingCycle, 4000);
    
    // Автоматически завершаем упражнение через 32 секунды (2 полных цикла)
    breathTimeout = setTimeout(() => {
        stopTactileBreathing();
        completeTask(); // Автоматически даем опыт за практику
        alert("Дыхание восстановлено! Капибара гордится тобой. +30 XP 🐹✨");
    }, 32000);
}

function stopTactileBreathing() {
    clearInterval(breathInterval);
    clearTimeout(breathTimeout);
    
    // Выключаем вибрацию принудительно
    if (navigator.vibrate) navigator.vibrate(0);
    
    // Возвращаем аватар в норму
    const avatar = document.getElementById('capi-container');
    avatar.style.transform = "scale(1)";
    avatar.style.transition = "transform 0.5s transition-all"; 
    
    // Возвращаем кнопку в исходное состояние
    const btn = document.getElementById('task-action-btn');
    btn.innerHTML = "Я выполнил! (+30 XP)";
    btn.onclick = completeTask;
    
    document.getElementById('task-text').innerText = "Дыхание завершено. Как ты сейчас?";
}
